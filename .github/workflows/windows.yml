name: windows

on:
  push:
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build patched Windows Terminal native control
        shell: pwsh
        run: .\eng\windows-terminal\Build-PatchedTerminal.ps1

      - name: Restore
        run: dotnet restore .\MultiKilo.sln

      - name: Build
        run: dotnet build .\MultiKilo.sln -c Release --no-restore

      - name: ConPTY and terminal smoke test
        shell: pwsh
        run: |
          $exe = ".\src\MultiKilo\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\MultiKilo.exe"
          if (-not (Test-Path $exe)) { throw "Built MultiKilo.exe not found at $exe" }
          $process = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru
          if (-not $process.WaitForExit(45000)) {
            $process.Kill($true)
            throw "Smoke test timed out after 45 seconds"
          }
          if ($process.ExitCode -ne 0) {
            $log = Join-Path (Split-Path $exe) "smoke-error.txt"
            if (Test-Path $log) { Get-Content $log }
            throw "Smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Publish portable x64 folder
        shell: pwsh
        run: .\build.ps1 -SkipTerminalBuild

      - name: Inspect output
        shell: pwsh
        run: |
          $exe = ".\dist\MultiKilo-win-x64\MultiKilo.exe"
          if (-not (Test-Path $exe)) { throw "MultiKilo.exe was not published." }
          if (-not (Test-Path ".\dist\MultiKilo-win-x64\Microsoft.Terminal.Control.dll")) { throw "Patched terminal DLL missing from portable output." }
          Get-ChildItem .\dist\MultiKilo-win-x64 -File | Sort-Object Name | Select-Object Name, Length | Format-Table -AutoSize
          $bytes = (Get-ChildItem .\dist\MultiKilo-win-x64 -Recurse -File | Measure-Object Length -Sum).Sum
          "Portable folder size: $([math]::Round($bytes / 1MB, 2)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: MultiKilo-win-x64
          path: dist/MultiKilo-win-x64/
          if-no-files-found: error
